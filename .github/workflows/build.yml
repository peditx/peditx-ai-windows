name: build
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --onefile --name PeDitX-AI --icon assets/peditx-ai.ico --add-data "web;web" --add-data "assets;assets" --paths src src/peditx_ai.py
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build NSIS installer
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { Write-Error "makensis.exe not found after choco install"; exit 1 }
          Push-Location packaging
          & $nsis installer.nsi
          Pop-Location
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: peditx-ai-windows
          path: dist/PeDitX-AI-Setup-x64.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PeDitX-AI-Setup-x64.exe
