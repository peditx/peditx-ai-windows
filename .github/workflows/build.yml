name: build
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --onefile --name PeDitX-AI --icon assets/peditx-ai.ico --add-data "web;web" --add-data "assets;assets" --paths src src/peditx_ai.py
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build NSIS installer
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          makensis packaging/installer.nsi
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: peditx-ai-windows
          path: dist/PeDitX-AI-Setup-x64.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PeDitX-AI-Setup-x64.exe
